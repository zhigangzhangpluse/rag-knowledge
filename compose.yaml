# ----------------------------------------------------------------------
# 一份配置同时描述两个服务：Milvus 保存向量索引，Redis 保存会话历史。
# SQLite 由 Python 应用访问本地文件，不需要在这里另启一个数据库服务。
# volumes 把容器中的数据映射到宿主机，重建容器时仍可保留；删除宿主机数据则无法靠映射恢复。
# RAG_VOLUME_DIR 可指定 D 盘位置，未配置时使用项目下 volumes 目录。
# 端口格式为 宿主机IP:宿主机端口:容器端口，127.0.0.1 限制从本机连接。
# 面试问：镜像与容器区别？答：镜像是运行模板，容器是用模板启动的实例，数据持久化另外配置。
# ----------------------------------------------------------------------
name: rag-knowledge
services:
  milvus:
    image: milvusdb/milvus:v2.5.16
    command: [milvus, run, standalone]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: 'true'
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
    volumes:
      - ${RAG_VOLUME_DIR:-./volumes}/milvus:/var/lib/milvus
      - ./deploy/embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
    ports:
      - 127.0.0.1:19530:19530
      - 127.0.0.1:9091:9091
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 10
  redis:
    image: redis:7.4.2-alpine
    command: [redis-server, --appendonly, 'yes']
    ports:
      - 127.0.0.1:6379:6379
    volumes:
      - ${RAG_VOLUME_DIR:-./volumes}/redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
